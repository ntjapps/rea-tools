version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "docker" # Dockerfile base images (digest-pinned, so Dependabot bumps the digest)
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
