name: Check scripts

# Manual-only (workflow_dispatch): shell syntax and shellcheck for the wrapper and installer.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: bash -n
        run: for f in rea install-skill.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck rea install-skill.sh
