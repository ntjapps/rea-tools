name: Build REA images

# Manual-only: no push, tag or schedule triggers; start it from the Actions tab (workflow_dispatch).
# Blacksmith Linux runners (owner rule 2026-11-11: Linux on Blacksmith, Windows on GitHub-hosted, macOS on its own vendor), with plain
# docker/setup-buildx-action: never a useblacksmith/* builder (billed sticky-disk cache).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Image to build"
        type: choice
        options: [both, base, native]
        default: both
      publish:
        description: "Push to ghcr.io (main only). Untick to test-build any branch: nothing is pushed."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [base, native]
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && inputs.publish }}
    steps:
      - name: Checkout
        if: inputs.target == 'both' || inputs.target == matrix.target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the REA version
        if: inputs.target == 'both' || inputs.target == matrix.target
        id: v
        run: echo "rea=$(sed -n 's/^ARG REA_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: inputs.target == 'both' || inputs.target == matrix.target
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        if: (inputs.target == 'both' || inputs.target == matrix.target) && env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        if: inputs.target == 'both' || inputs.target == matrix.target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ env.PUBLISH == 'true' }}
          # base -> <version>, native -> <version>-native (the tags the `rea` wrapper pulls)
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.rea }}${{ matrix.target == 'native' && '-native' || '' }}
          provenance: mode=min
